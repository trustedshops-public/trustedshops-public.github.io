version: '2.1'

parameters:
  generate-repos-metadata:
    type: boolean
    default: false

orbs:
  node: circleci/node@7.2.1
  github-utils: trustedshops-public/github-utils@1.3.1

jobs:
  generate-repos-metadata:
    executor: node/default
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: yarn
      - run:
          name: Generate repos metadata
          command: node scripts/generate-repos-metadata.js
      - run:
          name: Commit and push metadata
          command: |
            git config user.email "no-reply@trustedshops.com"
            git config user.name "trustedshops-public-cns-bot"
            git add public/repos-metadata.json
            git commit -m "chore: update repos metadata" || echo "No changes to commit"
            git push origin main
  build:
    executor: node/default
    steps:
      - checkout
      # picks up the metadata commit pushed by generate-repos-metadata in the scheduled run
      - run: git pull --ff-only origin "$CIRCLE_BRANCH"
      - node/install-packages:
          pkg-manager: yarn
      - run:
          name: Build with vite
          command: yarn run build
      - persist_to_workspace:
          root: .
          paths:
            - build/
  deploy:
    executor: node/default
    steps:
      - checkout
      - attach_workspace:
          at: .
      - github-utils/publish_github_pages:
          folder: build/
          git_commit_author_email: 'no-reply@trustedshops.com'
          git_commit_author_name: 'trustedshops-public-cns-bot'
          nojekyll: true
          cname: opensource.trustedshops.com

workflows:
  main:
    jobs:
      - build
      - deploy:
          context:
            - semantic-release
          requires:
            - build
          filters:
            branches:
              only:
                - main
  repos-metadata:
    when: << pipeline.parameters.generate-repos-metadata >>
    jobs:
      - generate-repos-metadata:
          context:
            - semantic-release
      - build:
          requires:
            - generate-repos-metadata
      - deploy:
          context:
            - semantic-release
          requires:
            - build
