version: '2.1'

parameters:
  generate-repos-metadata:
    type: boolean
    default: false

orbs:
  node: circleci/node@7.2.1
  github-utils: trustedshops-public/github-utils@1.3.1

jobs:
  build:
    executor: node/default
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: yarn
      - restore_cache:
          keys:
            - repos-metadata-v1-
      - run:
          name: Generate repos metadata if needed
          command: |
            if [ "<< pipeline.parameters.generate-repos-metadata >>" = "true" ] || [ ! -f public/repos-metadata.json ]; then
              node scripts/generate-repos-metadata.js
            fi
      - run:
          name: Fail if repos metadata is missing
          command: |
            test -f public/repos-metadata.json || { echo "public/repos-metadata.json is missing"; exit 1; }
      - save_cache:
          key: repos-metadata-v1-{{ epoch }}
          paths:
            - public/repos-metadata.json
      - run:
          name: Build with vite
          command: yarn run build
      - persist_to_workspace:
          root: .
          paths:
            - build/
  deploy:
    executor: node/default
    steps:
      - checkout
      - attach_workspace:
          at: .
      - github-utils/publish_github_pages:
          folder: build/
          git_commit_author_email: 'no-reply@trustedshops.com'
          git_commit_author_name: 'trustedshops-public-cns-bot'
          nojekyll: true
          cname: opensource.trustedshops.com

workflows:
  main:
    jobs:
      - build:
          context:
            - semantic-release
      - deploy:
          context:
            - semantic-release
          requires:
            - build
          filters:
            branches:
              only:
                - main
